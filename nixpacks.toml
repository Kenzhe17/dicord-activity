[phases.setup]
nixPkgs = ["nodejs-18_x"]

[phases.install]
cmds = ["npm install"]

[phases.build]
cmds = [
  "cd packages/shared && npm run build",
  "cd apps/web && npm run build",
  "cd apps/server && npm run build"
]

[start]
cmd = "node apps/server/dist/index.js"

[variables]
NODE_ENV = "production"
PORT = "3001"

[healthcheck]
httpPath = "/api/health"
