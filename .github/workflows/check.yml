name: Arcade platform checks
on:
  push:
  pull_request:
# push and pull_request fire for the same head commit; group by that sha so the
# duplicate run is cancelled instead of doubling CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan current branch history with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts=HEAD --redact=100 --no-banner
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Start isolated local PostgreSQL
        run: |
          node tooling/local-postgres.mjs > /tmp/arcade-postgres.log 2>&1 &
          for i in $(seq 1 30); do
            if grep -q 'Local PostgreSQL ready' /tmp/arcade-postgres.log; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: pnpm db:migrate:test
      - run: pnpm check
      - run: pnpm test:durak:sim
      - run: node tooling/smoke-built.mjs
      - run: node tooling/restart-smoke.mjs
      - name: Prefer Azure Ubuntu mirror for apt
        run: |
          if ! curl -fsSI --max-time 10 http://archive.ubuntu.com/ubuntu/dists/noble/Release >/dev/null; then
            sudo sed -i 's|http://archive.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g; s|http://security.ubuntu.com/ubuntu|http://azure.archive.ubuntu.com/ubuntu|g' /etc/apt/sources.list.d/ubuntu.sources || true
          fi
      - name: Install Playwright chromium (with apt retry)
        timeout-minutes: 25
        run: |
          for attempt in 1 2 3; do
            if timeout 420 pnpm exec playwright install --with-deps chromium; then exit 0; fi
            echo "playwright install attempt $attempt failed; retrying in 30s"
            sleep 30
          done
          exit 1
      - run: pnpm test:e2e
      - name: Repeat graceful restart E2E on Linux
        run: pnpm exec playwright test tests/e2e/durak.spec.ts --grep 'complete Durak' --repeat-each=3
      - name: Upload safe reconnect event diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconnect-diagnostics
          path: tests/.artifacts/**/reconnect-diagnostics.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
